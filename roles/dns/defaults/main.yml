---
# DNS role defaults
# 사용자가 inventory, group_vars, host_vars, extra_vars 등으로 변경할 수 있는 기본값을 정의한다.

# 외부 질의를 전달할 DNS 서버 목록
dns_forwarders:
  - 8.8.8.8

# inventory_hostname이 FQDN이면 domain 부분을 zone 이름으로 사용한다.
# FQDN이 아니면 빈 값으로 두고, tasks/03_config.yml에서 fail 처리한다.
dns_zone_name: "{{ inventory_hostname.split('.', 1)[1] if '.' in inventory_hostname else '' }}"

# /var/named 아래에 생성할 zone 파일 이름
dns_zone_file: "{{ dns_zone_name }}.zone"

# role 전용 zone include 파일
# /etc/named.rfc1912.zones는 덮어쓰지 않는다.
dns_zone_include_file: "/etc/named.{{ dns_zone_name }}.zones"

# DNS A 레코드로 등록할 inventory group
dns_record_groups:
  - all

# DNS MX 레코드로 등록할 inventory group
dns_mx_record_groups:
  - mailservers

# DNS MX 레코드 priority
dns_mx_priority: 10

# roles/dns/tests/test.yml에서 확인할 대상
dns_test_record: "{{ inventory_hostname }}"
