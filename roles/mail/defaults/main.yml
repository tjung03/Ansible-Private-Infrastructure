---
# MAIL role defaults
# 사용자가 inventory, group_vars, host_vars, extra_vars 등으로 변경할 수 있는 기본값을 정의한다.

# inventory_hostname이 FQDN이면 domain 부분을 mail domain으로 사용한다.
# FQDN이 아니면 빈 값으로 두고, tasks/03_config.yml에서 fail 처리한다.
mail_domain: "{{ inventory_hostname.split('.', 1)[1] if '.' in inventory_hostname else '' }}"

# mail server hostname
mail_hostname: "{{ inventory_hostname }}"

# Maildir 방식 사용
mail_home_mailbox: Maildir/

# Dovecot mail location
mail_location: maildir:~/Maildir

# firewalld에 등록할 서비스
mail_firewall_services:
  - smtp
  - imap
