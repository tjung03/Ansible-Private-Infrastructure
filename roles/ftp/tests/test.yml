---
# FTP role test
# role 적용 후 FTP 서버 자신에서 기본 파일 다운로드를 확인한다.

- name: FTP role test
  hosts: ftpservers
  gather_facts: true

  tasks:
    - name: FTP role 실행
      ansible.builtin.include_role:
        name: ftp
        public: true

    - name: FTP 다운로드 확인 - {{ ftp_test_url }}
      ansible.builtin.get_url:
        url: "{{ ftp_test_url }}"
        dest: "{{ ftp_test_dest }}"
        mode: '0644'
      register: ftp_test_result
