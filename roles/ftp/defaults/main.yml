---
# FTP role defaults
# 사용자가 inventory, group_vars, host_vars, extra_vars 등으로 변경할 수 있는 기본값을 정의한다.

# FTP 기본 디렉토리
ftp_root_dir: /var/ftp

# 익명 다운로드용 공개 디렉토리
ftp_public_dir: "{{ ftp_root_dir }}/pub"

# 공개 디렉토리에 생성할 기본 파일
ftp_sample_file: README.txt

# 기본 파일 내용
ftp_sample_content: |
  FTP Server
  Hostname: {{ inventory_hostname }}
  IP Address: {{ ansible_host | default(ansible_facts['default_ipv4']['address']) }}
  OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}

# firewalld에 등록할 서비스
ftp_firewall_service: ftp

# test.yml에서 확인할 FTP URL
# 테스트는 FTP 서버 자신에서 실행하므로 127.0.0.1을 사용한다.
ftp_test_url: "ftp://127.0.0.1/pub/{{ ftp_sample_file }}"

# test.yml에서 다운로드할 임시 파일 경로
ftp_test_dest: "/tmp/ansible_ftp_test_{{ ftp_sample_file }}"
